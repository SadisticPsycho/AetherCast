name: Build AetherCast APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Sender APK
        working-directory: ./sender
        run: |
          chmod +x gradlew || true
          # Create a basic gradle wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Build Receiver APK
        working-directory: ./receiver
        run: |
          chmod +x gradlew || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherCast-Sender
          path: sender/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherCast-Receiver
          path: receiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
